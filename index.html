<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق Be Qudwa</title>
    <style>
        /* متغيرات التصميم المطابقة للتطبيق */
        :root {
            --r: 18px;
            --rs: 12px;
            --rl: 24px;
            --s: 0 6px 20px rgba(0,0,0,.06);
            --sl: 0 12px 32px rgba(0,0,0,.1);
            --t: all .3s cubic-bezier(.4,0,.2,1);
            --f: 'Segoe UI', Tahoma, Arial, sans-serif;
            
            /* ألوان الثيم الفاتح */
            --bg: #F4F1EA;
            --c: #FFF;
            --tx: #2C3E2D;
            --tx2: #5A6B5C;
            --tx3: #8A9A8C;
            --p: #6B8E4E;
            --pd: #4A6B35;
            --ac2: #E8DFD0;
            --wn: #C9A961;
            --gr: linear-gradient(135deg, #6B8E4E, #4A6B35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--f);
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .card {
            background: var(--c);
            border-radius: var(--rl);
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--sl);
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* دوائر الخلفية المزخرفة */
        .card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--gr);
            opacity: 0.05;
            border-radius: 50%;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 100px;
            height: 100px;
            background: var(--gr);
            opacity: 0.05;
            border-radius: 50%;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: var(--ac2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--s);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .logo-container img {
            width: 70%;
            height: 70%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--tx);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .slogan {
            color: var(--tx2);
            font-size: 15px;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .info-box {
            background: var(--ac2);
            padding: 16px;
            border-radius: var(--r);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-around;
            position: relative;
            z-index: 1;
        }

        .info-item { text-align: center; }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--p);
        }

        .info-label {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 2px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--gr);
            color: #fff;
            text-decoration: none;
            border-radius: var(--r);
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(107, 142, 78, 0.3);
            transition: var(--t);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* تأثير الموجة عند الضغط */
        .download-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .download-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(107, 142, 78, 0.4);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            background: rgba(201, 169, 97, 0.1);
            border: 1px solid rgba(201, 169, 97, 0.3);
            border-radius: var(--rs);
            font-size: 13px;
            color: var(--wn);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: right;
            position: relative;
            z-index: 1;
        }

        .warning svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            stroke: var(--wn);
            fill: none;
            stroke-width: 2;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: var(--tx3);
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--p);
            text-decoration: none;
            font-weight: 600;
        }

        .credit {
            font-style: italic;
            letter-spacing: 0.5px;
            opacity: 0.85;
            background: linear-gradient(90deg, var(--p), var(--ac2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
